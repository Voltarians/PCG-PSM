[gpio]
# BCM numbering. GPIO17 and GPIO22 are owned by kernel overlays.
heartbeat_pin = 27
heartbeat_half_period_s = 0.5

[serial]
# Rev A Uno telemetry over USB. Heartbeat still works if serial is absent.
enabled = true
device = /dev/ttyACM0
baud = 115200
reconnect_s = 5

[status]
path = /run/pcg-psm/status.json
