<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:monospace;fill:#111}.t{font-family:sans-serif;font-weight:700;font-size:26px}.s{font-family:sans-serif;font-size:15px}.b{font-weight:700}.n{font-size:14px}.sm{font-size:12px}.box{fill:#fff;stroke:#111;stroke-width:2}.w{stroke:#111;stroke-width:3;fill:none}.d{stroke:#111;stroke-width:2;fill:none}</style>
<rect class="box" x="8" y="8" width="1584" height="884"/><text class="t" x="30" y="42">PCG-PSM Rev A.1 — Sheet 3 of 3</text><text class="s" x="30" y="66">Raspberry Pi 5 isolated shutdown request, heartbeat, and hardware safe-poweroff acknowledgement</text><line class="d" x1="10" y1="78" x2="1590" y2="78"/>
<!-- J7 -->
<rect class="box" x="45" y="115" width="360" height="220"/><text class="b n" x="140" y="105">J7 PI SIGNAL HEADER — SIGNALS ONLY</text><text class="n" x="75" y="155">J7-1 → Pi physical pin 1 / 3.3 V reference</text><text class="n" x="75" y="190">J7-2 → Pi physical pin 6 / GND</text><text class="n" x="75" y="225">J7-3 → Pi physical pin 11 / GPIO17 shutdown input</text><text class="n" x="75" y="260">J7-4 → Pi physical pin 13 / GPIO27 heartbeat output</text><text class="n" x="75" y="295">J7-5 → Pi physical pin 15 / GPIO22 safe-poweroff</text><text class="b n" x="75" y="325">NO PI 5 V POWER ON J7</text>
<rect class="box" x="1165" y="115" width="365" height="220"/><text class="b n" x="1270" y="145">U5 RASPBERRY PI 5</text><text class="n" x="1200" y="185">phys 1  = 3V3</text><text class="n" x="1200" y="220">phys 6  = GND</text><text class="n" x="1200" y="255">phys 11 = GPIO17</text><text class="n" x="1200" y="290">phys 13 = GPIO27</text><text class="n" x="1200" y="325">phys 15 = GPIO22</text>
<!-- U4B -->
<text class="b n" x="45" y="405">U4B / CHANNEL 2 — UNO REQUESTS PI SHUTDOWN</text><rect class="box" x="45" y="425" width="1030" height="110"/><text class="n" x="70" y="460">Uno D3 → R18 1 kΩ → U4 LED pin 3 / pin 4 → Uno GND</text><text class="n" x="70" y="490">Pi 3V3 → R19 10 kΩ → GPIO17 / U4 collector pin 14; emitter pin 13 → Pi GND</text><text class="n" x="70" y="520">D3 HIGH → optocoupler ON → GPIO17 LOW → gpio-shutdown initiates normal Linux shutdown</text>
<rect class="box" x="1110" y="405" width="420" height="130"/><text class="b n" x="1130" y="435">Pi boot overlay</text><text class="sm" x="1130" y="465">dtoverlay=gpio-shutdown,gpio_pin=17,</text><text class="sm" x="1130" y="485">active_low=1,gpio_pull=up,debounce=100</text><text class="sm" x="1130" y="515">U4B: LED 3/4, transistor C/E 14/13</text>
<!-- U4C -->
<text class="b n" x="45" y="585">U4C / CHANNEL 3 — PI HEARTBEAT TO UNO</text><rect class="box" x="45" y="605" width="1030" height="110"/><text class="n" x="70" y="640">GPIO27 → R20 1 kΩ → U4 LED pin 5 / pin 6 → Pi GND</text><text class="n" x="70" y="670">SUPERVISOR_5V → R21 10 kΩ → Uno D5 / U4 collector pin 12; emitter pin 11 → Uno GND</text><text class="n" x="70" y="700">Heartbeat service toggles GPIO27 every 500 ms; BOOT requires a real edge; RUN faults after ~15 s without an edge</text>
<rect class="box" x="1110" y="585" width="420" height="130"/><text class="b n" x="1130" y="615">Heartbeat contract</text><text class="n" x="1130" y="647">GPIO27 = 1 Hz full cycle</text><text class="n" x="1130" y="675">Edge-based; inversion is irrelevant</text><text class="sm" x="1130" y="705">U4C: LED 5/6, transistor C/E 12/11</text>
<!-- U4D -->
<text class="b n" x="45" y="765">U4D / CHANNEL 4 — PI SAFE-TO-CUT-POWER ACKNOWLEDGEMENT</text><rect class="box" x="45" y="785" width="1030" height="90"/><text class="n" x="70" y="820">GPIO22 → R22 1 kΩ → U4 LED pins 7/8 → Pi GND; R23 10 kΩ pulls Uno D4 up to SUPERVISOR_5V</text><text class="n" x="70" y="850">U4 collector pin 10 → Uno D4; emitter pin 9 → Uno GND. gpio-poweroff active → Uno D4 LOW → safe normal power cut.</text>
<rect class="box" x="1110" y="755" width="420" height="120"/><text class="b n" x="1130" y="785">Pi safe-poweroff overlay</text><text class="sm" x="1130" y="815">dtoverlay=gpio-poweroff,gpiopin=22</text><text class="sm" x="1130" y="842">U4D: LED 7/8, transistor C/E 10/9</text><text class="sm" x="1130" y="864">Hard timeout remains independent fallback.</text>
<!-- map -->
<rect class="box" x="450" y="115" width="650" height="220"/><text class="b n" x="675" y="145">LTV-847 COMPLETE PIN MAP</text><text class="n" x="485" y="185">CH1 ACC sense       LED 1/2   collector/emitter 16/15</text><text class="n" x="485" y="220">CH2 shutdown        LED 3/4   collector/emitter 14/13</text><text class="n" x="485" y="255">CH3 heartbeat       LED 5/6   collector/emitter 12/11</text><text class="n" x="485" y="290">CH4 safe-poweroff   LED 7/8   collector/emitter 10/9</text><text class="sm" x="485" y="320">No direct Uno 5 V logic reaches a Pi GPIO. High-current Pi power is a separate PS1 path.</text>
<text class="sm" x="1190" y="895">Rev A.1 · 2026-09-01 · bench-build schematic · permanent install gated on validation</text>
</svg>