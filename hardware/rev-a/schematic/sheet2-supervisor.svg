<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:monospace;fill:#111}.t{font-family:sans-serif;font-weight:700;font-size:26px}.s{font-family:sans-serif;font-size:15px}.b{font-weight:700}.n{font-size:14px}.sm{font-size:12px}.box{fill:#fff;stroke:#111;stroke-width:2}.w{stroke:#111;stroke-width:3;fill:none}.d{stroke:#111;stroke-width:2;fill:none}</style>
<rect class="box" x="8" y="8" width="1584" height="884"/><text class="t" x="30" y="42">PCG-PSM Rev A.1 — Sheet 2 of 3</text><text class="s" x="30" y="66">Self-latching supervisor supply, ACC/service wake, Arduino Uno, and analog monitoring</text><line class="d" x1="10" y1="78" x2="1590" y2="78"/>
<!-- latch -->
<rect class="box" x="45" y="120" width="165" height="90"/><text class="b n" x="68" y="110">J8 FROM SHEET 1</text><text class="n" x="65" y="155">1 PROTECTED_12V</text><text class="n" x="65" y="187">2 PCG_GND</text><line class="w" x1="210" y1="155" x2="330" y2="155"/>
<rect class="box" x="330" y="112" width="235" height="115"/><text class="b n" x="365" y="138">Q2 SQ7415CENW</text><text class="sm" x="350" y="163">Source pins 2–4 ← PROTECTED_12V</text><text class="sm" x="350" y="184">Gate pin 1</text><text class="sm" x="350" y="205">Drain pins 5–8/pad → SUPERVISOR_12V</text><line class="w" x1="565" y1="190" x2="630" y2="190"/><text class="b n" x="575" y="174">SUPERVISOR_12V</text>
<rect class="box" x="250" y="250" width="360" height="130"/><text class="b n" x="270" y="276">Q2 GATE NETWORK</text><text class="n" x="270" y="306">R5 100 kΩ: Source → Gate pull-up</text><text class="n" x="270" y="332">DZ1 12 V: cathode Source, anode Gate</text><text class="n" x="270" y="358">R4 4.7 kΩ: Gate → LATCH_PULLDOWN</text><text class="sm" x="270" y="376">R4 limits pull-down / Zener current and is required.</text>
<!-- regulator -->
<rect class="box" x="655" y="110" width="310" height="180"/><text class="b n" x="720" y="138">U3 NCV7805BDTRKG</text><text class="n" x="685" y="175">1 IN ← SUPERVISOR_12V</text><text class="n" x="685" y="202">2 / tab → PCG_GND</text><text class="n" x="685" y="229">3 OUT → SUPERVISOR_5V</text><text class="sm" x="685" y="260">C6 0.33µ + C7 10µ/35V input</text><text class="sm" x="685" y="278">C8 100n + C9 100µ/10V output</text>
<!-- Uno -->
<rect class="box" x="1030" y="100" width="500" height="250"/><text class="b n" x="1190" y="130">A1 Arduino Uno R3 — existing</text><text class="n" x="1060" y="170">5V ← SUPERVISOR_5V</text><text class="n" x="1060" y="198">GND → PCG_GND</text><text class="n" x="1060" y="226">D2 ACC_SENSE_N</text><text class="n" x="1060" y="254">D3 SHUTDOWN_REQ</text><text class="n" x="1060" y="282">D4 SAFE_POWEROFF_ACK_N</text><text class="n" x="1060" y="310">D5 HEARTBEAT</text><text class="n" x="1300" y="170">D6 MAIN_EN</text><text class="n" x="1300" y="198">D7 SELF_HOLD</text><text class="n" x="1300" y="226">D8 SERVICE_SENSE_N</text><text class="n" x="1300" y="254">A0 VEHICLE_VOLT</text><text class="n" x="1300" y="282">A1 MAIN_5V</text><text class="n" x="1300" y="310">A2 TEMP   A3 U2_IS</text>
<!-- wake section -->
<text class="b n" x="45" y="430">WAKE / HOLD LOGIC</text><rect class="box" x="45" y="450" width="175" height="105"/><text class="b n" x="70" y="440">J2 VEHICLE CONTROL</text><text class="n" x="70" y="490">1 ACC</text><text class="n" x="70" y="525">2 PCG_GND</text>
<rect class="box" x="260" y="445" width="250" height="130"/><text class="b n" x="280" y="472">Q3 ACC HARDWARE WAKE</text><text class="n" x="280" y="500">ACC → R6 47k/0.5W → base</text><text class="n" x="280" y="526">R7 100k base→emitter</text><text class="n" x="280" y="552">D2 1N4148 reverse B-E clamp</text><text class="sm" x="280" y="570">collector → LATCH_PULLDOWN; emitter → GND</text>
<rect class="box" x="550" y="445" width="265" height="130"/><text class="b n" x="595" y="472">SW1 SERVICE WAKE</text><text class="n" x="575" y="500">DPST momentary N.O.</text><text class="n" x="575" y="526">Pole A: LATCH_PULLDOWN → GND</text><text class="n" x="575" y="552">Pole B: D8 SERVICE_SENSE_N → GND</text><text class="sm" x="575" y="570">D8 uses INPUT_PULLUP; firmware latches service boot.</text>
<rect class="box" x="850" y="445" width="230" height="130"/><text class="b n" x="895" y="472">Q4 SELF-HOLD</text><text class="n" x="875" y="500">D7 → R8 4.7k → base</text><text class="n" x="875" y="526">R9 100k base→emitter</text><text class="n" x="875" y="552">collector → LATCH_PULLDOWN</text><text class="sm" x="875" y="570">emitter → PCG_GND</text>
<rect class="box" x="1115" y="430" width="415" height="160"/><text class="b n" x="1235" y="458">U4A ACC LOGIC SENSE</text><text class="n" x="1140" y="490">ACC → R10 4.7k/0.5W → LED pins 1/2 → GND</text><text class="n" x="1140" y="516">D3 1N4148 antiparallel across pins 1/2</text><text class="n" x="1140" y="542">pin 16 collector → Uno D2; pin 15 emitter → GND</text><text class="n" x="1140" y="568">R11 10k: D2 pull-up → SUPERVISOR_5V</text>
<!-- analog -->
<text class="b n" x="45" y="640">ANALOG DIAGNOSTICS</text><rect class="box" x="45" y="660" width="455" height="170"/><text class="b n" x="65" y="688">A0 — protected 12 V</text><text class="n" x="65" y="718">PROTECTED_12V → R12 180k 1% → node → R13 22k 1% → GND</text><text class="n" x="65" y="744">C10 100n node→GND; node → R14 10k → Uno A0</text><text class="n" x="65" y="772">D4 SBAT54SLT1G: pin1 GND, pin3 A0, pin2 SUPERVISOR_5V</text><text class="sm" x="65" y="800">Automotive dual-Schottky secondary ADC rail clamp.</text>
<rect class="box" x="535" y="660" width="420" height="170"/><text class="b n" x="555" y="688">A1 — main 5 V sense</text><text class="n" x="555" y="718">J4-1 MAIN_5V → R15 47k 1% → Uno A1 node</text><text class="n" x="555" y="744">R16 47k 1% node→GND; C11 100n node→GND</text><text class="n" x="555" y="772">J4-2 → PCG_GND</text><text class="sm" x="555" y="800">J4 is sense-only; no high-current Pi power through this circuit.</text>
<rect class="box" x="990" y="660" width="340" height="170"/><text class="b n" x="1010" y="688">A2 — power-area temperature</text><text class="n" x="1010" y="718">SUPERVISOR_5V → R17 10k 1% → A2 node</text><text class="n" x="1010" y="744">TH1 10k NTC B3950: A2 node → GND</text><text class="sm" x="1010" y="780">Mount TH1 near power/protection components.</text>
<rect class="box" x="1360" y="660" width="170" height="170"/><text class="b n" x="1380" y="688">A3</text><text class="n" x="1380" y="718">U2 IS sense</text><text class="n" x="1380" y="744">from Sheet 1</text><text class="sm" x="1380" y="780">calibrate against</text><text class="sm" x="1380" y="798">external ammeter</text>
<text class="sm" x="1150" y="865">Rev A.1 · 2026-09-01 · bench-build schematic · permanent install gated on validation</text>
</svg>