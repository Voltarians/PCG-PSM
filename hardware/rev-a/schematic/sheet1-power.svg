<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:monospace;fill:#111}.t{font-family:sans-serif;font-weight:700;font-size:26px}.s{font-family:sans-serif;font-size:15px}.b{font-weight:700}.n{font-size:14px}.sm{font-size:12px}.box{fill:#fff;stroke:#111;stroke-width:2}.w{stroke:#111;stroke-width:3;fill:none}.d{stroke:#111;stroke-width:2;fill:none}</style>
<rect class="box" x="8" y="8" width="1584" height="884"/><text class="t" x="30" y="42">PCG-PSM Rev A.1 — Sheet 1 of 3</text><text class="s" x="30" y="66">Protected automotive 12 V path, smart high-side switch, and external 5 V converter</text><line class="d" x1="10" y1="78" x2="1590" y2="78"/>
<!-- main path -->
<rect class="box" x="45" y="135" width="155" height="95"/><text class="b n" x="70" y="125">J1 BATTERY INPUT</text><text class="n" x="70" y="170">1 VBAT+</text><text class="n" x="70" y="202">2 PCG_GND</text>
<line class="w" x1="200" y1="170" x2="250" y2="170"/><rect class="box" x="250" y="145" width="105" height="50"/><text class="b n" x="270" y="175">F1 10 A</text><line class="w" x1="355" y1="170" x2="415" y2="170"/>
<rect class="box" x="415" y="125" width="180" height="90"/><text class="b n" x="445" y="151">Q1 BUK9Y8R8-60EL</text><text class="sm" x="438" y="176">S pins 1–3   G pin 4</text><text class="sm" x="438" y="195">Drain = exposed base</text><line class="w" x1="595" y1="170" x2="695" y2="170"/><circle cx="695" cy="170" r="5" fill="#111"/><text class="b n" x="625" y="145">PROTECTED_12V</text>
<!-- U1 -->
<rect class="box" x="330" y="300" width="390" height="250"/><text class="b n" x="455" y="330">U1 LM74610-Q1 / VSSOP-8</text><text class="n" x="355" y="370">4 ANODE → Q1 Source</text><text class="n" x="355" y="402">1 VCAPL</text><text class="n" x="355" y="434">2 GATE_PD → Q1 Gate</text><text class="n" x="355" y="466">3 NC</text><text class="n" x="530" y="370">8 CATHODE → Q1 Drain</text><text class="n" x="530" y="402">7 VCAPH</text><text class="n" x="530" y="434">6 GATE_DRV → Q1 Gate</text><text class="n" x="530" y="466">5 NC</text><rect class="box" x="445" y="490" width="165" height="40"/><text class="n" x="462" y="515">C4 2.2 µF X7R</text><text class="sm" x="365" y="575">C4 directly between pins 7 and 1. Q1 source/anode on fused side; drain/cathode on protected side.</text>
<!-- protection bank -->
<line class="w" x1="695" y1="170" x2="1000" y2="170"/><line class="d" x1="735" y1="170" x2="735" y2="260"/><rect class="box" x="690" y="260" width="90" height="48"/><text class="b sm" x="702" y="280">D1</text><text class="sm" x="697" y="298">SLD8S18A</text><line class="d" x1="735" y1="308" x2="735" y2="345"/><text class="sm" x="715" y="366">GND</text>
<line class="d" x1="820" y1="170" x2="820" y2="260"/><rect class="box" x="785" y="260" width="70" height="48"/><text class="sm" x="797" y="280">C1</text><text class="sm" x="790" y="298">470µ/50V</text><line class="d" x1="820" y1="308" x2="820" y2="345"/>
<line class="d" x1="895" y1="170" x2="895" y2="260"/><rect class="box" x="860" y="260" width="70" height="48"/><text class="sm" x="872" y="280">C2</text><text class="sm" x="869" y="298">1µ/50V</text><line class="d" x1="895" y1="308" x2="895" y2="345"/>
<line class="d" x1="970" y1="170" x2="970" y2="260"/><rect class="box" x="935" y="260" width="70" height="48"/><text class="sm" x="947" y="280">C3</text><text class="sm" x="940" y="298">100n/50V</text><line class="d" x1="970" y1="308" x2="970" y2="345"/>
<!-- U2 -->
<rect class="box" x="1035" y="115" width="270" height="310"/><text class="b n" x="1090" y="145">U2 BTS50060-1TEA</text><text class="n" x="1060" y="190">5 VS ← PROTECTED_12V</text><text class="n" x="1060" y="240">2 IN ← R1 10k ← Uno D6</text><text class="n" x="1060" y="290">1 GND → PCG_GND</text><text class="n" x="1060" y="340">3 OUT/TAB → SWITCHED_12V</text><text class="n" x="1060" y="390">4 IS → A3 sense node</text><text class="sm" x="1060" y="415">R2 100k IN→GND</text><line class="w" x1="1000" y1="170" x2="1035" y2="190"/>
<rect class="box" x="835" y="390" width="165" height="55"/><text class="n" x="852" y="414">R1 10 kΩ series</text><text class="sm" x="850" y="432">UNO_D6_MAIN_EN</text><line class="d" x1="1000" y1="418" x2="1035" y2="240"/>
<rect class="box" x="1050" y="470" width="235" height="90"/><text class="b n" x="1070" y="494">U2 IS DIAGNOSTIC</text><text class="n" x="1070" y="520">R3 470 Ω 1% → GND</text><text class="n" x="1070" y="544">C5 4.7 nF → GND</text>
<!-- J3 and PS1 -->
<line class="w" x1="1305" y1="340" x2="1370" y2="340"/><rect class="box" x="1370" y="285" width="170" height="110"/><text class="b n" x="1390" y="275">J3 TO PS1</text><text class="n" x="1390" y="330">1 SWITCHED_12V</text><text class="n" x="1390" y="365">2 PCG_GND</text>
<rect class="box" x="1010" y="610" width="530" height="190"/><text class="b n" x="1130" y="640">PS1 Mean Well DDR-60G-5</text><text class="n" x="1040" y="680">5 +VIN ← J3-1 SWITCHED_12V</text><text class="n" x="1040" y="710">6 -VIN ← PCG_GND</text><text class="n" x="1260" y="680">3,4 +VOUT → MAIN_5V high-current</text><text class="n" x="1260" y="710">1,2 -VOUT → MAIN_5V_RETURN</text><text class="sm" x="1070" y="755">9–36 V input; 4.5–5.5 V adjustable; 10.8 A / 54 W. Adjust so Pi sees ~5.10 V under representative load.</text>
<!-- notes -->
<text class="b n" x="45" y="650">REV A.1 RULES</text><text class="sm" x="55" y="680">• F1 near vehicle source. D1/C1/C2/C3 return short to intentional PCG star ground.</text><text class="sm" x="55" y="704">• Full 5 V load never passes through the Uno shield or Pi GPIO header.</text><text class="sm" x="55" y="728">• A3 current sense is local PCG diagnostics only; factory Volt current sensor remains whole-vehicle source.</text><text class="sm" x="55" y="752">• Validate reverse polarity, surge clamping, 5 V startup overshoot, and thermal rise before vehicle permanence.</text>
<text class="sm" x="1190" y="860">Rev A.1 · 2026-09-01 · bench-build schematic · permanent install gated on validation</text>
</svg>